[project]
name = "aiquant-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "cuweir",email = "cuweir@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "python-dotenv (>=1.1.0,<1.2.0)",
    "ccxt (>=4.4.86,<4.5.0)",
    "pandas (>=2.2.3,<2.4.0)",
    "openai (>=1.99.5,<2.0.0)",
    "httpx[socks] (>=0.28.1,<0.29.0)",
    "google-generativeai (>=0.8.5,<0.9.0)",
    "pydantic (>=2.11.5,<2.12.0)",
    "pandas-ta (==0.4.71b0)",
    "protobuf (>=5.29.5,<5.30.0)",
    "rich (>=14.0.0,<14.1.0)",
    "sqlalchemy (>=2.0.41,<2.1.0)",
    "alembic (>=1.16.4,<1.17.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "apscheduler (>=3.11.0,<3.12.0)",
    "backtrader (>=1.9.78.123,<1.10.0.0)",
    "numpy (>=1.24.4)",
    "scikit-learn (>=1.5.2,<1.6.0)",
    "joblib (>=1.4.2,<1.5.0)",
    "pyarrow (>=17.0.0,<18.0.0)",
    "pytest (>=8.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app" }
]